name: Figure Skating Competition Registration Alert

on:
  schedule:
    # Runs twice daily at 07:09 and 19:09 Danish Time (06:09 & 18:09 UTC in CET)
    - cron: '9 6,18 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test WhatsApp alert (verifies secrets & CallMeBot)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (do not persist state or send live alerts)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-competitions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Competition Registration Scanner
        env:
          NOTIFIERS_ENABLED: 'whatsapp,console'
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -m src.main --test-alert
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --check --dry-run
          else
            python -m src.main --check
          fi

      - name: Commit updated state if changed
        if: ${{ inputs.test_alert != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): update tracked competition registration snapshot [skip ci]"
            git push
          fi
